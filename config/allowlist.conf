# rm-linux-lockdown allowlist
#
# Anything listed here is considered SAFE and will be left alone. Anything
# NOT listed here (enabled services, listening ports) will be flagged for
# you to approve disabling/blocking when rm-linux-lockdown.sh runs.
#
# Syntax (one entry per line):
#   service:<systemd unit name, without .service>
#   port:<port number>/<tcp|udp>
#
# Lines starting with # and blank lines are ignored.
#
# ---------------------------------------------------------------------------
# Services commonly required for a healthy, remotely-manageable system.
# Uncomment/remove entries that don't apply to you, and add your own.
# ---------------------------------------------------------------------------
service:sshd
service:ssh
service:systemd-journald
service:systemd-logind
service:systemd-udevd
service:systemd-networkd
service:systemd-resolved
service:systemd-timesyncd
service:NetworkManager
service:dbus
service:cron
service:crond
service:rsyslog

# ---------------------------------------------------------------------------
# Ports that should remain reachable. 22/tcp (SSH) is included by default so
# you don't lock yourself out of a remote box -- remove it only if you have
# reliable local/console access.
# ---------------------------------------------------------------------------
port:22/tcp
